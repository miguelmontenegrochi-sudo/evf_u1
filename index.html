<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVF_U1</title>
    <style>
        body {
            background-color:lightblue;
            color:brown;
            margin: 50px;
            font-family: Arial, sans-serif;
            font-size: 25px;
            text-align: center;
        }
        h2.h2_c {
            color:black;
            font-size: 30px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        input, button {
            padding: 30px;
            font-size: 15px;
            margin: 10px;
            width: 120px;
        }
        #Resultado {
            color:blue;
            font-size: 25px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2 class="h2_c">Evaluación Formativa Unidad 1 Tecnologías Web</h2>
    
    <!-- Campo donde el usuario escribe las notas -->
    <input type="number" id="nota1" placeholder="Primera Nota" min="1" max="7">
    <span>+</span>
    <input type="number" id="nota2" placeholder="Segunda Nota" min="1" max="7">
    <span>+</span>
    <input type="number" id="nota3" placeholder="Tercera Nota" min="1" max="7">
    <span>+</span>
    <input type="number" id="nota4" placeholder="Cuarta Nota" min="1" max="7">
    <br>
    <!-- Botón para calcular el promedio -->
    <button onclick="calcularPromedio()">Calcular Promedio</button>
    <br>  
    <!-- Elemento donde se muestra el resultado -->
    <div id="Resultado">El promedio aparecerá aquí.</div>
    <!-- Código JavaScript -->
    <script>
       function calcularPromedio() {
        //Paso A: Obtener el valor de las notas
        let nota1 = document.getElementById("nota1").value;
        let nota2 = document.getElementById("nota2").value;
        let nota3 = document.getElementById("nota3").value;
        let nota4 = document.getElementById("nota4").value;
        //Paso B: Convertir los valores a números
        let num1 = Number(nota1);
        let num2 = Number(nota2);
        let num3 = Number(nota3);
        let num4 = Number(nota4);
        //Paso C: Calcular el promedio
        let promedio = (num1 + num2 + num3 + num4) /4;
        //Paso D: Mostrar el resultado en pantalla dentro de la etiqueta #Resultado"
        document.getElementById("Resultado").textContent = "El promedio es: " + promedio;
    }
     </script>

</body>
</html>
